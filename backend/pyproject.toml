[project]
name = "venv-project"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "alembic",
    "pydantic-settings",
    "python-jose[cryptography]",
    "pyjwt[crypto]",
    "python-multipart",
    "asyncpg>=0.31.0",
    "types-passlib==1.7.7.20260211",
    "psycopg[binary]",
    "pwdlib[bcrypt]",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "httpx2>=2.13.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "aiosqlite>=0.19",
    "httpx>=0.24",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
